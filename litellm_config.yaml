# LiteLLM Proxy Configuration: Multi-Account Gemini Load Balancing Pool
# Route gemini-pro and gemini-flash across 5 Google Gemini accounts with automatic failover and usage-based routing

model_list:
  # Gemini 5-Account Pool: gemini-pro
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_1}

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_2}

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_3}

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_4}

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_5}

  # Gemini 5-Account Pool: gemini-flash
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_1}

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_2}

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_3}

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_4}

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: ${GEMINI_API_KEY_5}

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 3
  cooldown_time: 30

general_settings:
  master_key: sk-litellm-internal
  database_url: null
  disable_spend_logs: true

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 30
