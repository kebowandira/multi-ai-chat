# Source template. Do not edit runtime/librechat.yaml directly — it is
# generated by scripts/configure.py, which substitutes ${VARS} from .env and
# removes any custom endpoint whose API key is blank.
version: 1.2.1
cache: true

interface:
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

registration:
  socialLogins: ["google", "github"]
  allowedDomains: []

mcpServers:
  agy:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/agy-mcp-server.mjs"

  lightpanda:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/lightpanda-mcp-server.mjs"

  scraper:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/scraper-mcp-server.mjs"

  github:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/@modelcontextprotocol/server-github/dist/index.js"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

  memory:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/node_modules/@modelcontextprotocol/server-memory/dist/index.js"

  sequential-thinking:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js"

  filesystem:
    type: "stdio"
    command: "node"
    args:
      - "/app/mcp_modules/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js"
      - "/app/uploads"

endpoints:
  openAI:
    titleConvo: true
    titleModel: "current_model"
    modelDisplayLabel: "OpenAI"

  anthropic:
    titleConvo: true
    titleModel: "current_model"
    modelDisplayLabel: "Claude"

  google:
    titleConvo: true
    titleModel: "current_model"
    modelDisplayLabel: "Gemini"
    models:
      default:
        - "gemini-3.6-flash"
        - "gemini-3.5-flash-lite"
        - "gemini-3.8-flash"
        - "gemini-3.5-flash"
        - "gemini-3.1-flash-lite"
        - "gemini-3.1-pro-preview"
      fetch: false

  custom:
    # Gemini 4-Account Pool via LiteLLM
    - name: "Gemini 4-Account Pool"
      apiKey: "sk-litellm-internal"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["gemini-pro", "gemini-flash"]
        fetch: false
      titleModel: "gemini-flash"
      dropParams: ["stop"]

    # DeepSeek — official OpenAI-compatible API
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "${DEEPSEEK_BASE_URL}"
      models:
        default: ["${DEEPSEEK_FAST_MODEL}", "${DEEPSEEK_PRO_MODEL}"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "DeepSeek"

    # Alibaba Qwen — official Model Studio OpenAI-compatible endpoint
    - name: "Qwen"
      apiKey: "${DASHSCOPE_API_KEY}"
      baseURL: "${DASHSCOPE_BASE_URL}"
      models:
        default: ["${QWEN_TURBO_MODEL}", "${QWEN_PLUS_MODEL}"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Qwen"

    # Z.ai GLM — ordinary API endpoint, manual route (not in budget pool by default)
    - name: "Z.ai"
      apiKey: "${ZAI_API_KEY}"
      baseURL: "${ZAI_BASE_URL}"
      models:
        default: ["${ZAI_MODEL}"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "GLM"

    # xAI Grok — official OpenAI-compatible API
    - name: "xAI"
      apiKey: "${XAI_API_KEY}"
      baseURL: "${XAI_BASE_URL}"
      models:
        default: ["${XAI_MODEL}"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Grok"

    # Meta — dev.meta.ai Model API (OpenAI-compatible)
    - name: "Meta"
      apiKey: "${META_API_KEY}"
      baseURL: "${META_BASE_URL}"
      models:
        default: ["${META_MODEL}"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Meta"

    # Groq — ultra-fast LPU inference (free tier available at console.groq.com)
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default: ["openai/gpt-oss-120b", "qwen/qwen3.8-27b", "openai/gpt-oss-20b"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Groq"

    # OpenRouter — multi-provider routing (free tier available at openrouter.ai)
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["nvidia/nemotron-3.5-super-vl:free", "xingchen-agi/xing4.0-29b-a4b:free", "dots-studio/dots-3-note-preview:free"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "OpenRouter"

    # NVIDIA — official OpenAI-compatible NIM free endpoints (build.nvidia.com)
    - name: "NVIDIA"
      apiKey: "${NVIDIA_API_KEY}"
      baseURL: "https://integrate.api.nvidia.com/v1"
      models:
        default:
          - "nvidia/nemotron-3-ultra-550b-a55b"
          - "poolside/laguna-xs-2.1"
          - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
          - "nvidia/nemotron-3.5-bolt-e4b"
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "NVIDIA"

    # SmartRouter — LiteLLM gateway aliases (only present when COMPOSE_PROFILES=router)
    - name: "SmartRouter"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        default: ["auto", "coding", "research", "cheap"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "SmartRouter"
